<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b2a44"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#61dafb">
        <animate attributeName="stop-color" values="#61dafb;#0e75b6;#a78bfa;#61dafb" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#61dafb;#0e75b6;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <style>
    .title { font: 700 54px 'Segoe UI', Ubuntu, sans-serif; fill: url(#txt); opacity: 0; animation: up 1s ease-out .2s forwards; }
    .sub   { font: 500 20px 'Fira Code', Consolas, monospace; fill: #c9d1d9; opacity: 0; animation: up 1s ease-out .8s forwards; }
    .code  { font: 14px 'Fira Code', Consolas, monospace; fill: #61dafb; opacity: .18; }
    .orbit { transform-origin: 830px 130px; animation: spin 10s linear infinite; }
    .orbit2{ transform-origin: 830px 130px; animation: spin 10s linear infinite; animation-delay: -3.3s; }
    .orbit3{ transform-origin: 830px 130px; animation: spin 10s linear infinite; animation-delay: -6.6s; }
    .float { animation: float 4s ease-in-out infinite; }
    .cursor{ animation: blink 1s step-end infinite; }
    @keyframes up    { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>

  <!-- floating code background -->
  <g class="float">
    <text class="code" x="40" y="40">const dev = useQuery(['rizki'])</text>
    <text class="code" x="420" y="235">&lt;ThemeProvider theme={mui}&gt;</text>
    <text class="code" x="560" y="40">z.object({ passion: z.literal('UI') })</text>
  </g>

  <!-- text -->
  <text class="title" x="60" y="125">Rizki Pratama</text>
  <text class="sub" x="62" y="168">Senior Frontend Developer • React • TypeScript<tspan class="cursor" fill="#61dafb">_</tspan></text>

  <!-- React atom -->
  <g filter="url(#glow)" stroke="#61dafb" stroke-width="3" fill="none">
    <g class="orbit"><ellipse cx="830" cy="130" rx="85" ry="32"/></g>
    <g class="orbit2"><ellipse cx="830" cy="130" rx="85" ry="32" transform="rotate(60 830 130)"/></g>
    <g class="orbit3"><ellipse cx="830" cy="130" rx="85" ry="32" transform="rotate(120 830 130)"/></g>
  </g>
  <circle cx="830" cy="130" r="13" fill="#61dafb" filter="url(#glow)">
    <animate attributeName="r" values="11;15;11" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
